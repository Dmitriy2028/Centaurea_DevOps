name: CI Pipeline

on:
  workflow_run:
    workflows: ["Frontend Tests"]
    types:
      - completed

jobs:
  build:
    name: Build Docker
    runs-on: self-hosted  # Укажите ваш self-hosted runner

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Get tag from commit message
      id: get_tag
      run: |
        # Извлекаем тег из сообщения коммита, например "Version: 0.3.2"
        TAG=$(git log -1 --pretty=%B | grep -oP 'Version: \K(\S+)')
        echo "TAG=$TAG" >> $GITHUB_ENV  # передаем тег в переменные окружения

    - name: Build and push Docker image
      uses: docker/build-push-action@v3
      with:
        context: ./src/frontend 
        dockerfile: ./src/frontend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/calculator-front:${{ env.TAG }}