name: Frontend Tests

on:
  push:
    branches:
      - release   # Работает только при пуше в ветку release
    paths:
      - 'src/frontend/**'  # Работает только при изменении файлов в папке src


jobs:
  build_and_test:
    name: Build Docker image and run tests
    runs-on: self-hosted  # Используем self-hosted runner

    steps:
    - name: Checkout code
      uses: actions/checkout@v3  # Клонируем репозиторий

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2  # Настроим Buildx для многоплатформенных сборок

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image using Dockerfile.frontend-test
      run: |
        # Строим Docker-образ с использованием Dockerfile.frontend-test
        docker build -f src/frontend/Dockerfile.frontend-test -t calculator-front:test ./src/frontend

    - name: Run Docker container and execute tests
      run: |
        # Запускаем контейнер и тесты в фоновом режиме
        docker run --name calculator-front-test-container calculator-front:test
        # Docker автоматически выполнит тесты, так как CMD уже настроен в Dockerfile

    - name: Stop and remove Docker container
      run: |
        # Останавливаем контейнер после выполнения тестов
        docker stop calculator-front-test-container
        docker rm calculator-front-test-container

    - name: Remove Docker image
      run: |
        # Удаляем Docker-образ, чтобы освободить место
        docker rmi calculator-front:test